# Informazioni personali
title: Damiano Paoli
position: PhD Candidate in Economics
institution: Alma Mater Studiorum - University of Bologna
bio: >-
  <p>Hello there!<br>
  I work in behavioral and experimental economics. I am completing my PhD at the <a href="https://dse.unibo.it/en" target="_blank">University of Bologna</a>,
  advised by <a href="https://www.unibo.it/sitoweb/maria.bigoni/en" target="_blank">Maria Bigoni</a> and <a href="https://www.giacomorubbini.com/" target="_blank">Giacomo Rubbini</a>.</p>

  <p><strong>I am on the 2026/27 academic job market.</strong> My thesis defense is scheduled for March/April 2027.</p>

  <p>My <a href="/research/">research</a> uses laboratory and online experiments to study how people interact with artificial intelligence and with other people using it, with a focus on human oversight of AI, fairness, AI-assisted communication and coordination.</p>

  <p>I'm the local organizer of the <a href="https://sites.google.com/site/ideemeetings" target="_blank">IDEE meetings</a>;
  if you are interested in presenting, please reach out.</p>

